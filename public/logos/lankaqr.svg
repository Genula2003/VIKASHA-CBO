<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <rect width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- LankaQR National 4-Color Finder Pattern -->
  <!-- 1. Top Left: Orange (Tamil community representation in national flag) -->
  <rect x="7" y="7" width="11" height="11" rx="2.5" fill="#F47920"/>
  <rect x="9.5" y="9.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  <rect x="11" y="11" width="3" height="3" rx="0.75" fill="#F47920"/>
  
  <!-- 2. Top Right: Royal Blue (CBSL / Digital Banking trust) -->
  <rect x="22" y="7" width="11" height="11" rx="2.5" fill="#005BAC"/>
  <rect x="24.5" y="9.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  <rect x="26" y="11" width="3" height="3" rx="0.75" fill="#005BAC"/>
  
  <!-- 3. Bottom Left: Maroon / Crimson (National heritage) -->
  <rect x="7" y="22" width="11" height="11" rx="2.5" fill="#8D1B3D"/>
  <rect x="9.5" y="24.5" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  <rect x="11" y="26" width="3" height="3" rx="0.75" fill="#8D1B3D"/>
  
  <!-- 4. Center & Bottom Right QR Data Modules: Emerald Green & Slate -->
  <rect x="22" y="22" width="4" height="4" rx="1" fill="#008542"/>
  <rect x="28" y="22" width="5" height="4" rx="1" fill="#005BAC"/>
  <rect x="22" y="28" width="5" height="5" rx="1" fill="#8D1B3D"/>
  <rect x="29" y="28" width="4" height="5" rx="1" fill="#008542"/>
  
  <!-- Mini Central Matrix Accents -->
  <rect x="15" y="15" width="3" height="3" rx="0.5" fill="#F47920"/>
  <rect x="19" y="15" width="3" height="3" rx="0.5" fill="#005BAC"/>
  <rect x="15" y="19" width="3" height="3" rx="0.5" fill="#8D1B3D"/>
  <rect x="19" y="19" width="3" height="3" rx="0.5" fill="#008542"/>
</svg>
